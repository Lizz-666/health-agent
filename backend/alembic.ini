# Alembic configuration.
#
# The database URL is intentionally NOT stored here to avoid committing
# real credentials. The effective URL is injected by alembic/env.py from the
# application settings (settings.DATABASE_URL), which is loaded from
# environment variables / .env.

[alembic]
# Location of migration scripts, relative to this file.
script_location = alembic

# Allow alembic to import the application package (app.*).
prepend_sys_path = .

# Do NOT set sqlalchemy.url here; env.py injects it from settings.
# sqlalchemy.url =


[post_write_hooks]
# No auto-format hooks enabled.


# --- Logging configuration ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
